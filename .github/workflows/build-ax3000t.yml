# Put this in a GitHub repo of yours as .github/workflows/build-ax3000t.yml,
# then run it from the Actions tab ("Run workflow").
#
# It clones openwrt/openwrt main, merges the chosen PR on top, builds the
# device's default package set, and uploads the images as a workflow artifact.

name: Build OpenWrt snapshot (AX3000T + PR)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "openwrt/openwrt PR number to merge onto main"
        default: "25679"
      device:
        description: "Device profile (xiaomi_mi-router-ax3000t = stock layout; xiaomi_mi-router-ax3000t-ubootmod = ubootmod layout)"
        default: "xiaomi_mi-router-ax3000t"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PR: ${{ inputs.pr }}
      DEVICE: ${{ inputs.device }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      # Full history on purpose: the snapshot revision (rNNNNN) is derived from it.
      - name: Clone openwrt main
        run: git clone https://github.com/openwrt/openwrt.git openwrt

      - name: Merge the PR
        working-directory: openwrt
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git fetch origin "refs/pull/${PR}/head"
          git merge --no-edit FETCH_HEAD
          git log --oneline -3

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (device default packages only)
        working-directory: openwrt
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y
          EOF
          make defconfig
          grep -E '^CONFIG_TARGET_(mediatek|DEVICE)' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build
        working-directory: openwrt
        run: make -j"$(($(nproc) + 1))" || make -j1 V=s

      - name: Collect images
        working-directory: openwrt
        run: |
          mkdir -p ../out
          cp bin/targets/mediatek/filogic/*"${DEVICE}"* ../out/
          cp bin/targets/mediatek/filogic/{sha256sums,config.buildinfo,version.buildinfo,profiles.json} ../out/ 2>/dev/null || true
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device }}-pr${{ inputs.pr }}
          path: out/
